<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0f13" />
    <link rel="icon" href="./favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>F1 Card Battle</title>
    <script>
      // tema prima del primo disegno, per evitare il lampo bianco/nero
      try {
        var p = localStorage.getItem('f1-card-battle:theme') || 'system';
        var d = p === 'dark' || (p === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = d ? 'dark' : 'light';
      } catch (e) {}
    </script>
    <link rel="preload" as="image" href="./logo-card.png" />
    <style>
      /* animazione di apertura: è anche la schermata di caricamento (si vede subito, prima del gioco) */
      html, body { margin: 0; background: #dc1437; }
.intro {
  position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; overflow: hidden; cursor: pointer;
  background: radial-gradient(circle at 50% 45%, #f0506a 0%, #dc1437 45%, #8f0a24 100%);
  transition: opacity 0.35s ease;
}
.intro.leaving { opacity: 0; pointer-events: none; }
.intro-stage { position: relative; width: min(52vw, 230px); aspect-ratio: 310 / 405; }
.intro-card {
  position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; border-radius: 8%;
  filter: drop-shadow(0 16px 30px rgba(0, 0, 0, 0.45));
  transform: translateY(18%) scale(0.92); opacity: 0;
  animation: intro-card 1.7s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
}
.intro-pack { position: absolute; left: -9%; right: -9%; top: 8%; bottom: -14%; z-index: 2; animation: intro-pack 1.7s ease forwards; }
.intro-pack-body {
  position: absolute; inset: 10% 0 0 0; padding-top: 6%; border-radius: 6px 6px 14px 14px; display: grid; place-content: center; justify-items: center;
  background:
    repeating-linear-gradient(115deg, rgba(255, 255, 255, 0.08) 0 10px, transparent 10px 22px),
    linear-gradient(160deg, #3a3f4c 0%, #1b1e25 55%, #0f1115 100%);
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45), inset 0 0 0 3px rgba(255, 255, 255, 0.12);
}
.intro-pack-body span { font-size: clamp(54px, 18vw, 84px); font-weight: 900; font-style: italic; color: #ff4d5e; letter-spacing: -2px; text-shadow: 0 4px 0 #7a0a1c; }
.intro-pack-body small { font-weight: 900; letter-spacing: 6px; color: #f3f4f6; font-size: 14px; }
.intro-pack-top {
  position: absolute; left: 0; right: 0; top: 0; height: 13%; z-index: 3; border-radius: 6px 6px 0 0;
  background: linear-gradient(180deg, #e9ecf2 0%, #a9afbb 55%, #7d8494 100%);
  transform-origin: 0% 100%;
  animation: intro-tear 1.7s ease forwards;
}
.intro-flash {
  position: absolute; left: 50%; top: 12%; width: 260%; aspect-ratio: 1; z-index: 0; pointer-events: none;
  background: radial-gradient(circle, rgba(255, 255, 255, 0.85) 0%, rgba(255, 220, 230, 0.35) 25%, transparent 60%);
  opacity: 0; transform: translate(-50%, -50%) scale(0.2);
  animation: intro-flash 1.7s ease-out forwards;
}
@keyframes intro-pack {
  0% { transform: translateY(70vh) rotate(-8deg); }
  20% { transform: translateY(0) rotate(0); }
  24% { transform: translateX(-3%) rotate(-2deg); }
  27% { transform: translateX(3%) rotate(2deg); }
  30% { transform: translateX(0) rotate(0); }
  58% { transform: translateY(0); opacity: 1; }
  80%, 100% { transform: translateY(85vh) rotate(6deg); opacity: 1; }
}
@keyframes intro-tear {
  0%, 28% { transform: none; opacity: 1; }
  40% { transform: translate(40%, -60%) rotate(-28deg); opacity: 1; }
  52%, 100% { transform: translate(120%, -160%) rotate(-55deg); opacity: 0; }
}
@keyframes intro-card {
  0%, 30% { transform: translateY(18%) scale(0.92); opacity: 0; }
  33% { opacity: 1; }
  58% { transform: translateY(-34%) scale(0.96); opacity: 1; }
  78%, 100% { transform: translateY(0) scale(1.06); opacity: 1; }
}
@keyframes intro-flash {
  0%, 32% { opacity: 0; transform: translate(-50%, -50%) scale(0.2); }
  42% { opacity: 1; }
  70%, 100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
}
.intro.still .intro-pack { display: none; }
.intro.still .intro-card { animation: none; transform: none; opacity: 1; }
@media (prefers-reduced-motion: reduce) {
  .intro-pack, .intro-flash { display: none; }
  .intro-card { animation: none; transform: none; opacity: 1; }
}
    </style>
  </head>
  <body>
    <div id="intro" class="intro" aria-hidden="true">
      <div class="intro-stage">
        <img class="intro-card" src="./logo-card.png" alt="" draggable="false" />
        <div class="intro-pack">
          <div class="intro-pack-top" style="clip-path: polygon(0 0, 100% 0, 100.00% 72%, 97.22% 100%, 94.44% 72%, 91.67% 100%, 88.89% 72%, 86.11% 100%, 83.33% 72%, 80.56% 100%, 77.78% 72%, 75.00% 100%, 72.22% 72%, 69.44% 100%, 66.67% 72%, 63.89% 100%, 61.11% 72%, 58.33% 100%, 55.56% 72%, 52.78% 100%, 50.00% 72%, 47.22% 100%, 44.44% 72%, 41.67% 100%, 38.89% 72%, 36.11% 100%, 33.33% 72%, 30.56% 100%, 27.78% 72%, 25.00% 100%, 22.22% 72%, 19.44% 100%, 16.67% 72%, 13.89% 100%, 11.11% 72%, 8.33% 100%, 5.56% 72%, 2.78% 100%, 0.00% 72%)"></div>
          <div class="intro-pack-body" style="clip-path: polygon(0.00% 3.5%, 2.78% 0%, 5.56% 3.5%, 8.33% 0%, 11.11% 3.5%, 13.89% 0%, 16.67% 3.5%, 19.44% 0%, 22.22% 3.5%, 25.00% 0%, 27.78% 3.5%, 30.56% 0%, 33.33% 3.5%, 36.11% 0%, 38.89% 3.5%, 41.67% 0%, 44.44% 3.5%, 47.22% 0%, 50.00% 3.5%, 52.78% 0%, 55.56% 3.5%, 58.33% 0%, 61.11% 3.5%, 63.89% 0%, 66.67% 3.5%, 69.44% 0%, 72.22% 3.5%, 75.00% 0%, 77.78% 3.5%, 80.56% 0%, 83.33% 3.5%, 86.11% 0%, 88.89% 3.5%, 91.67% 0%, 94.44% 3.5%, 97.22% 0%, 100.00% 3.5%, 100% 100%, 0 100%)"><span>F1</span><small>CARDS</small></div>
        </div>
        <div class="intro-flash"></div>
      </div>
    </div>
    <script>
      // la busta resta finché il gioco non è pronto (minimo il tempo dell'animazione); un tocco la salta
      (function () {
        var el = document.getElementById('intro');
        var MIN_MS = 1700;
        var gone = false;
        function hide() {
          if (gone || !el) return;
          gone = true;
          el.classList.add('leaving');
          setTimeout(function () { el.remove(); }, 380);
        }
        var ready = false;
        // in sviluppo lo stile arriva con il JavaScript; nella build lo segnala il <link> (vite.config.ts)
        var cssReady = !document.querySelector('link[rel="preload"][as="style"]');
        function maybeHide() {
          if (ready && cssReady) setTimeout(hide, Math.max(0, MIN_MS - performance.now()));
        }
        el.addEventListener('click', function () { if (ready && cssReady) hide(); });
        window.__introReady = function () { ready = true; maybeHide(); };
        window.__cssReady = function () { cssReady = true; maybeHide(); };
        // rete o telefono lentissimi: dopo 8 secondi si toglie comunque
        setTimeout(hide, 8000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
