# Avatar a cartone dei piloti dalle foto libere di Wikimedia Commons (scripts/make-avatars.py).
# Parte da sola quando cambia lo script, oppure a mano da Actions → "Avatars" → Run workflow
# (con "force" rifà anche gli avatar già fatti).
name: Avatars

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rifai tutti gli avatar
        type: boolean
        default: false
  push:
    paths:
      - scripts/make-avatars.py
      - .github/workflows/avatars.yml

permissions:
  contents: write

jobs:
  avatars:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dipendenze (PyTorch solo CPU)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install pillow requests "rembg[cpu]"
          # una sola copia di OpenCV (rembg ne porta un'altra: due insieme si rompono a vicenda)
          pip uninstall -y opencv-python opencv-python-headless opencv-contrib-python opencv-contrib-python-headless || true
          pip install "opencv-python-headless>=4.8,<5"  # YuNet (FaceDetectorYN) da OpenCV 4.8
          python -c "import cv2; cv2.FaceDetectorYN; print('OpenCV', cv2.__version__)"
      # rifà tutti gli avatar con i nuovi controlli (volto riconosciuto, sfondo tolto bene)
      - run: python scripts/make-avatars.py --force
      - name: Salva il risultato
        run: |
          git add -A public/avatars src/data/avatars.json
          if git diff --cached --quiet; then echo "nessuna novità"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update cartoon driver avatars"
          git push
