name: App Android (APK di prova)

on:
  push:
    branches: ['claude/**', main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          # librerie di Gradle in cache: non si riscaricano ogni volta da Maven Central (che a volte risponde 429)
          cache: gradle
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      # se Maven Central rifiuta per troppe richieste (429), si aspetta un minuto e si riprova una volta
      - run: ./gradlew assembleDebug --no-daemon || (sleep 60 && ./gradlew assembleDebug --no-daemon)
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: f1-card-battle-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
