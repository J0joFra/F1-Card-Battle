# Prova delle figure in vinile dei piloti (scripts/vinyl-test.py): salva i risultati in samples/vinyl/.
name: Vinyl test

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/vinyl-test.py
      - .github/workflows/vinyl-test.yml

permissions:
  contents: write

jobs:
  vinyl:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Spazio su disco (i modelli pesano diversi GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Dipendenze (PyTorch solo CPU)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install pillow requests "rembg[cpu]" diffusers transformers accelerate safetensors
          pip uninstall -y opencv-python opencv-python-headless opencv-contrib-python opencv-contrib-python-headless || true
          pip install "opencv-python-headless>=4.8,<5"
      - run: python scripts/vinyl-test.py
      - name: Salva il risultato
        if: always()
        run: |
          git add -A samples/vinyl
          if git diff --cached --quiet; then echo "nessuna novità"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Vinyl figure test samples"
          git pull --rebase -q && git push
