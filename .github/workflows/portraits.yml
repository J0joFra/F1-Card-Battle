# Foto dei piloti da Wikimedia Commons: aggiorna src/data/portraits.json (link, autore e licenza).
# Parte da sola quando cambia lo script, oppure a mano da Actions → "Portraits" → Run workflow.
name: Portraits

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/fetch-portraits.mjs
      - .github/workflows/portraits.yml

permissions:
  contents: write

jobs:
  portraits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: git clone --depth 1 https://github.com/f1db/f1db.git ../f1db
      - run: node scripts/fetch-portraits.mjs ../f1db
      - name: Salva il risultato
        run: |
          if git diff --quiet src/data/portraits.json; then echo "nessuna novità"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/portraits.json
          git commit -m "Update driver photos from Wikimedia Commons"
          git push
