name: Crea la chiave per Google Play (una volta sola)

# Crea la chiave di caricamento (upload key) senza installare niente sul PC.
# Prima: Settings → Secrets and variables → Actions → New repository secret
#   nome  ANDROID_KEYSTORE_PASSWORD   valore: una password lunga scelta da te (almeno 12 caratteri)
# Poi: Actions → "Crea la chiave per Google Play" → Run workflow → scarica "f1-upload-key" in fondo alla pagina.
# Il file è protetto da quella password: senza password non serve a nessuno. Resta scaricabile per 1 giorno.
on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Chiave
        env:
          STOREPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ ${#STOREPASS} -lt 12 ]; then echo "Crea prima il secret ANDROID_KEYSTORE_PASSWORD (almeno 12 caratteri)" && exit 1; fi
          keytool -genkeypair -keystore f1-upload.jks -storetype PKCS12 -alias upload \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass:env STOREPASS -keypass:env STOREPASS \
            -dname "CN=F1 Card Battle, O=J0joFra, C=IT"
      - uses: actions/upload-artifact@v4
        with:
          name: f1-upload-key
          path: f1-upload.jks
          retention-days: 1
